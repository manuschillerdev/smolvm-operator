name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run one pure unit test
        run: go test ./internal/controller -run TestBuildCreateRequestMapsSpec -count=1

  envtest:
    name: envtest controller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run controller-runtime envtest
        run: make test

  kind-e2e:
    name: kind e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: helm/kind-action@v1
        with:
          cluster_name: kind
      - name: Run one deployment e2e test
        env:
          RUN_E2E: "true"
          KIND_CLUSTER: kind
        run: make test-e2e
