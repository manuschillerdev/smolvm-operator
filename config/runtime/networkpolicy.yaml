apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smolvm-runtime-api
  namespace: system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smolvm-runtime
      app.kubernetes.io/component: runtime
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          control-plane: controller-manager
    ports:
    - protocol: TCP
      port: 9443
