apiVersion: v1
kind: Secret
metadata:
  name: smolvm-runtime-auth
  namespace: system
type: Opaque
stringData:
  token: change-me
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: smolvm-runtime
  namespace: system
  labels:
    app.kubernetes.io/name: smolvm-runtime
    app.kubernetes.io/component: runtime
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: smolvm-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smolvm-runtime
        app.kubernetes.io/component: runtime
    spec:
      serviceAccountName: controller-manager
      containers:
      - name: runtime
        image: smolvm-runtime:latest
        command:
        - /runtime-agent
        args:
        - --bind-address=:9443
        - --smolvm-api-socket=/var/run/smolvm/smolvm.sock
        ports:
        - name: runtime-api
          containerPort: 9443
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SMOLVM_RUNTIME_TOKEN
          valueFrom:
            secretKeyRef:
              name: smolvm-runtime-auth
              key: token
              optional: true
        securityContext:
          privileged: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9443
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9443
            scheme: HTTPS
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: kvm
          mountPath: /dev/kvm
        - name: state
          mountPath: /var/lib/smolvm
        - name: run
          mountPath: /var/run/smolvm
      volumes:
      - name: kvm
        hostPath:
          path: /dev/kvm
      - name: state
        hostPath:
          path: /var/lib/smolvm
          type: DirectoryOrCreate
      - name: run
        hostPath:
          path: /var/run/smolvm
          type: DirectoryOrCreate
