---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: smolvms.vm.smolvm.dev
spec:
  group: vm.smolvm.dev
  names:
    kind: SmolVM
    listKind: SmolVMList
    plural: smolvms
    singular: smolvm
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.nodeName
      name: Node
      type: string
    - jsonPath: .status.machineName
      name: Machine
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SmolVM is the Schema for the smolvms API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SmolVMSpec defines the desired state of a smolvm machine.
            properties:
              from:
                description: |-
                  From is a path to a .smolmachine sidecar artifact available to the node runtime.
                  It is mutually exclusive with Image.
                minLength: 1
                type: string
              image:
                description: Image is an OCI image to run inside the smolvm machine.
                minLength: 1
                type: string
              network:
                description: Network configures outbound networking and host port
                  mappings.
                properties:
                  allowedCIDRs:
                    description: AllowedCIDRs restricts egress to the listed CIDR
                      ranges when supported by the runtime.
                    items:
                      format: cidr
                      type: string
                    type: array
                  enabled:
                    description: Enabled enables outbound TCP/UDP networking.
                    type: boolean
                  ports:
                    description: Ports maps host ports to guest ports on the selected
                      node.
                    items:
                      description: SmolVMPort maps a node host port to a guest port.
                      properties:
                        guestPort:
                          description: GuestPort is the TCP port inside the VM.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        hostPort:
                          description: HostPort is the TCP port opened on the node.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                      required:
                      - guestPort
                      - hostPort
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - hostPort
                    x-kubernetes-list-type: map
                type: object
              nodeName:
                description: |-
                  NodeName pins the machine to a Kubernetes node. Machines are node-local and
                  must not move implicitly after creation.
                type: string
              resources:
                description: Resources configures VM CPU and memory.
                properties:
                  cpus:
                    description: CPUs is the requested vCPU count.
                    format: int32
                    minimum: 1
                    type: integer
                  memoryMiB:
                    description: MemoryMiB is the requested memory ceiling in MiB.
                    format: int32
                    minimum: 64
                    type: integer
                type: object
              running:
                default: true
                description: Running declares whether the machine should be running.
                type: boolean
              storage:
                description: Storage configures persistent local machine disks.
                properties:
                  overlayGiB:
                    description: OverlayGiB is the overlay disk size. It can only
                      grow.
                    format: int64
                    minimum: 1
                    type: integer
                  storageGiB:
                    description: StorageGiB is the storage disk size. It can only
                      grow.
                    format: int64
                    minimum: 1
                    type: integer
                type: object
            type: object
            x-kubernetes-validations:
            - message: exactly one of spec.image or spec.from is required
              rule: (has(self.image) && size(self.image) > 0) != (has(self.from) &&
                size(self.from) > 0)
            - message: spec.nodeName is immutable after binding
              rule: '!has(oldSelf.nodeName) || (has(self.nodeName) && self.nodeName
                == oldSelf.nodeName)'
          status:
            description: SmolVMStatus defines the observed state of a smolvm machine.
            properties:
              conditions:
                description: Conditions describe reconciliation and readiness.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              machineName:
                description: MachineName is the stable smolvm runtime name owned by
                  this CR.
                type: string
              network:
                description: Network is the runtime-observed network enablement.
                type: boolean
              nodeName:
                description: NodeName is the node currently owning this machine's
                  local state.
                type: string
              observedGeneration:
                description: ObservedGeneration is the metadata generation last reconciled
                  by the controller.
                format: int64
                type: integer
              overlayGiB:
                description: OverlayGiB is the runtime-observed overlay disk size.
                format: int64
                type: integer
              phase:
                description: Phase is a compact machine phase such as Pending, Created,
                  Running, Stopped, Failed, or Unknown.
                type: string
              ports:
                description: Ports are the runtime-observed host-to-guest port mappings.
                items:
                  description: SmolVMPort maps a node host port to a guest port.
                  properties:
                    guestPort:
                      description: GuestPort is the TCP port inside the VM.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    hostPort:
                      description: HostPort is the TCP port opened on the node.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                  required:
                  - guestPort
                  - hostPort
                  type: object
                type: array
              runtimePID:
                description: RuntimePID is the local process ID reported by the smolvm
                  runtime when available.
                format: int32
                type: integer
              storageGiB:
                description: StorageGiB is the runtime-observed storage disk size.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
