# permissions for end users to edit smolvms.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: smolvm-editor-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: operator
    app.kubernetes.io/part-of: operator
    app.kubernetes.io/managed-by: kustomize
  name: smolvm-editor-role
rules:
- apiGroups:
  - vm.smolvm.dev
  resources:
  - smolvms
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - vm.smolvm.dev
  resources:
  - smolvms/status
  verbs:
  - get
